<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C040"/>
      <stop offset="50%" style="stop-color:#C9A227"/>
      <stop offset="100%" style="stop-color:#A07820"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#dark)"/>
  <!-- Wicket stumps -->
  <rect x="20" y="16" width="3.5" height="28" rx="1.5" fill="url(#gold)"/>
  <rect x="30.25" y="16" width="3.5" height="28" rx="1.5" fill="url(#gold)"/>
  <rect x="40.5" y="16" width="3.5" height="28" rx="1.5" fill="url(#gold)"/>
  <!-- Bails -->
  <rect x="18" y="14" width="11" height="3.5" rx="1.75" fill="url(#gold)"/>
  <rect x="35" y="14" width="11" height="3.5" rx="1.75" fill="url(#gold)"/>
  <!-- Ground line -->
  <rect x="14" y="44" width="36" height="2" rx="1" fill="url(#gold)" opacity="0.5"/>
</svg>
